<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Stylized "100" Number & Book Base -->
  <g id="number-100">
    <!-- Number 1 -->
    <path d="M22 65 L36 45 L36 78 L22 78 Z" fill="url(#goldGrad)" />
    <!-- Book Wings forming zeros -->
    <!-- Open Book Left Page (Zero 1) -->
    <path d="M42 42 C50 36, 68 38, 76 45 L76 82 C68 76, 48 74, 42 78 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Open Book Right Page (Zero 2) -->
    <path d="M84 45 C92 38, 110 36, 118 42 L118 78 C112 74, 92 76, 84 82 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Spine lines -->
    <line x1="80" y1="45" x2="80" y2="82" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Heritage Quill / Fountain Pen -->
  <g id="feather-pen">
    <path d="M68 28 C74 15, 80 8, 88 4 C85 14, 82 25, 78 35 C75 42, 73 50, 71 58 L67 56 C68 46, 67 36, 68 28 Z" fill="#FBBF24" />
    <path d="M71 58 L68 66 L65 59 Z" fill="#D97706" />
    <path d="M68 66 L68 72" stroke="#B45309" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Modern Digital Studio Podcast Mic -->
  <g id="podcast-mic">
    <rect x="94" y="24" width="16" height="26" rx="8" fill="url(#cyanGrad)" filter="url(#glow)"/>
    <!-- Mic grille lines -->
    <line x1="97" y1="31" x2="107" y2="31" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="97" y1="37" x2="107" y2="37" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="97" y1="43" x2="107" y2="43" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <!-- Mic U-stand -->
    <path d="M90 36 C90 52, 114 52, 114 36" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Stem and base -->
    <line x1="102" y1="52" x2="102" y2="62" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="94" y1="62" x2="110" y2="62" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text "100 ЖЫЛ" -->
  <text x="80" y="102" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900" letter-spacing="3" fill="#1E293B">
    100 ЖЫЛ
  </text>
  <text x="80" y="115" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#64748B">
    1926 — 2026
  </text>
</svg>
